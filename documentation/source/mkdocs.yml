site_name: CosmoLattice World #Manual#
repo_url: https://github.com/cosmolattice/cosmolattice

theme:
  name: material
  features:
    - content.code.copy
    - content.code.select
    - navigation.tabs
    - navigation.path
    - navigation.indexes
    - toc.integrate
  logo: assets/CL_Icon.png
  favicon: assets/CL_Icon.png
  palette:
    # Light mode (default for everyone; toggle to switch manually)
    - scheme: default
      primary: white
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode (opt-in via toggle)
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/git-alt
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

plugins:
  - bibtex:
      bib_file: "refs.bib"
  - mkdoxy:
      projects:
        CosmoLattice: # name of project must be alphanumeric + numbers (without spaces)
          src-dirs: ../tmp/code_source/templat/include ../tmp/code_source/cosmolattice/include # path to source code (support multiple paths separated by space) => INPUT
          full-doc: True # if you want to generate full documentation
          doxy-cfg: # standard doxygen configuration (key: value)
            FILE_PATTERNS: "*.cpp *.h" # specify file patterns to filter out
            STRIP_FROM_PATH: ../../
            RECURSIVE: True # recursive search in source directories
      full-doc: True # if you want to generate full documentation
  - search
  - autorefs
  - offline
  - gen-files:
      scripts:
        - exclusions.py

markdown_extensions:
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  #- markdown_katex:
  #    no_inline_svg: True
  #    insert_fonts_css: True
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format:
            !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {
              kwds: { mode: generic },
            }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/emgithub-fixraw.js
  - javascripts/sidebar-toggle.js
  - javascripts/news-bar.js #Added by DGF (July 3rd 2026) for have a news bar on top
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js #Added by DGF (July 5th 2026) to have latex

extra_css:
  - extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css
  - stylesheets/news-bar.css #Added by DGF (July 3rd 2026) for have a news bar on top

hooks:
  - hooks/resolve_emgithub.py

use_directory_urls: false # (optional) for better links without .html extension

