    constraints: "One value per spatial dimension (NDim = 1, 2 or 3); supply NDim values, e.g. 'N N N' for the full 3D box. The underlying HDF5 saver pre-allocates a fixed array of length 10 (the maximum supported NDim), but only the first NDim entries are read; any extra values up to 10 are ignored and fewer values are padded with the default. Default is N in every dimension."
  - name: "snap_stepcoord"
