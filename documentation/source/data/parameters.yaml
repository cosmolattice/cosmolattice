    important: false
    scope: "framework"
    category: "snapshots"
    units: "dimensionless"
    description: "Stride (in lattice units) used when sampling the snapshot sub-volume, one value per spatial dimension. A value of s keeps every s-th lattice point along that axis (coarsening the saved data); 1 means keep every point."
    constraints: "One value per spatial dimension (NDim = 1, 2 or 3); supply NDim values, e.g. '1 1 1' to keep every point in 3D. The underlying HDF5 saver pre-allocates a fixed array of length 10 (the maximum supported NDim), but only the first NDim entries are read; any extra values up to 10 are ignored and fewer values are padded with the default. Default is 1 in every dimension."

