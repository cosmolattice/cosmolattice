metadata:
  schema_version: 1
  description: "Single source of truth for all CosmoLattice input parameters (framework + every shipped model). Drafted by automated extraction from source headers; descriptions to be curated."
  field_order: [name, type, enum_values, arity, required, default, important, scope, category, units, description, constraints]
  # === BEGIN generated model capabilities — scripts/gen_model_capabilities.py (do not edit) ===
  models:
    lphi4: {NScalars: 2, NDim: 3}
    NMC_lphi4: {NScalars: 2, NDim: 3, couplings: {nonMinimal: true}}
    NMC_tanh4_w_mass_P: {NScalars: 2, NDim: 3, couplings: {nonMinimal: true}}
    axionU1_m2phi2: {NScalars: 1, NU1Flds: 1, NDim: 3, couplings: {axionU1: true}}
    defects_ONGlobal: {NScalars: 1, NDim: 3}
    defects_U1LocalStrings: {NCScalars: 1, NU1Flds: 1, NDim: 3, couplings: {csU1: true}}
    lphi4SU2U1: {NScalars: 1, NCScalars: 1, NU1Flds: 1, NSU2Doublet: 1, NSU2Flds: 1, NDim: 3, couplings: {csU1: true, su2dbU1: true, su2dbSU2: true}}
    lphi4U1: {NCScalars: 1, NU1Flds: 1, NDim: 3, couplings: {csU1: true}}
    tanh2: {NScalars: 2, NDim: 3}
  # === END generated model capabilities ===
parameters:

  # === framework / run ===
  - name: "N"
    type: "int"
    enum_values: null
    arity: "1"
    required: true
    default: null
    important: true
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Number of lattice points per spatial dimension (the lattice is N^3 in 3D)."
    constraints: null
  - name: "kIR"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "-1"
    important: true
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Infrared cutoff of the lattice in program units; the minimum (nonzero) momentum on the lattice."
    constraints: "Mutually exclusive with lSide: exactly one of kIR or lSide must be specified; they are related by kIR = 2*pi/lSide and an inconsistent pair throws. Default -1 means unspecified."
  - name: "lSide"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "-1"
    important: true
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Comoving side length of the cubic simulation box in program units."
    constraints: "Mutually exclusive with kIR: exactly one of kIR or lSide must be specified; they are related by lSide = 2*pi/kIR and an inconsistent pair throws. Default -1 means unspecified."
  - name: "dt"
    type: "float"
    enum_values: null
    arity: "1"
    required: true
    default: null
    important: true
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Time step of the evolution algorithm in program units."
    constraints: "Cannot be zero (throws if dt==0)."
  - name: "expansion"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "true"
    important: true
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "If true, the scale factor evolves self-consistently via the Friedmann equations; if false, the scale factor is fixed to unity and dynamics occur in Minkowski spacetime."
    constraints: null
  - name: "t0"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "0"
    important: true
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Initial time of the simulation in program units."
    constraints: "tMax must be >= t0."
  - name: "tMax"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "10000*dt"
    important: true
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Final time of the simulation in program units."
    constraints: "Must be >= t0."
  - name: "fixedBackground"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "If true, replaces the self-consistent expansion by a fixed background expansion specified through omegaEoS and H0."
    constraints: "Only read if expansion=true; otherwise forced to false."
  - name: "omegaEoS"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "1/3"
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Barotropic equation-of-state parameter w = p/rho used for the fixed background expansion (e.g. 0.333 for radiation domination)."
    constraints: "Only read if fixedBackground=true (else 0.0); fractions are not allowed, use e.g. 0.333. Default value is 1.0/3.0."
  - name: "H0"
    type: "float"
    enum_values: null
    arity: "1"
    required: true
    default: null
    important: false
    scope: "framework"
    category: "run"
    units: "GeV"
    description: "Initial Hubble rate used for the fixed background expansion (in GeV)."
    constraints: "Only read if fixedBackground=true (else 0.0); mandatory in that case (no default, throws if missing)."
  - name: "a0"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "1.0"
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Initial value of the scale factor at the start of the simulation."
    constraints: null
  - name: "evolver"
    type: "enum"
    enum_values: ["LF", "VV2", "VV4", "VV6", "VV8", "VV10", "VV6_2", "RK2", "RK3_3", "RK3_4", "RK4_5", "PV2", "PV4", "PV6", "PV8", "PV10", "PV6_2"]
    arity: "1"
    required: false
    default: "LF"
    important: true
    scope: "framework"
    category: "run"
    units: "n/a"
    description: "Type of time-evolution algorithm: LF (staggered leapfrog), velocity-Verlet (VV*), position-Verlet (PV*), or Runge-Kutta (RK*) schemes of various orders."
    constraints: "Valid values: LF, VV2, VV4, VV6, VV8, VV10, VV6_2, RK2, RK3_3, RK3_4, RK4_5, PV2, PV4, PV6, PV8, PV10, PV6_2 (also accepts integers 0-16)."
  - name: "tolerance"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "-1"
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Error tolerance used by adaptive (e.g. Runge-Kutta) solvers to control the adaptive time step."
    constraints: "Only relevant for adaptive solvers; default -1 indicates unset."

  - name: "doDiffusion"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Master switch enabling a post-evolution diffusion phase, in which the fields are further relaxed after the main simulation has finished (used e.g. to smooth defect configurations). The diffusion-phase parameters (tmaxdiff, dtdiff, diffusionevolver, tOutputFreqDiff, tOutputRareFreqDiff, snapshots_diffusion) are only read when this is true."
    constraints: null
  - name: "tmaxdiff"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: null
    important: false
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Duration (maximum time) of the diffusion phase in program units."
    constraints: "Only read when doDiffusion=true, in which case it is mandatory (no default); otherwise unused (0.0)."
  - name: "dtdiff"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: null
    important: false
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Time step used during the diffusion phase in program units."
    constraints: "Only read when doDiffusion=true, in which case it is mandatory (no default); otherwise unused (0.0)."
  - name: "diffusionevolver"
    type: "enum"
    enum_values: ["LF", "VV2", "VV4", "VV6", "VV8", "VV10", "VV6_2", "RK2", "RK3_3", "RK3_4", "RK4_5", "PV2", "PV4", "PV6", "PV8", "PV10", "PV6_2"]
    arity: "1"
    required: false
    default: "RK2"
    important: false
    scope: "framework"
    category: "run"
    units: "n/a"
    description: "Time-evolution algorithm used during the diffusion phase (same set of integrators as evolver)."
    constraints: "Only read when doDiffusion=true; defaults to RK2. Valid values: LF, VV2, VV4, VV6, VV8, VV10, VV6_2, RK2, RK3_3, RK3_4, RK4_5, PV2, PV4, PV6, PV8, PV10, PV6_2."
  - name: "doResolutionPreserving"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Master switch enabling the resolution-preserving technique, which rescales the lattice and fields during the run to keep the relevant physical scales resolved. Its parameters (sRP, tRP0, tRPMax) are only read when this is true."
    constraints: "Requires fixedBackground=true; if fixedBackground=false it is forced to false (the technique is not yet tested/supported for self-consistent expansion)."
  - name: "sRP"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: null
    important: false
    scope: "framework"
    category: "run"
    units: "dimensionless"
    description: "Rescaling (stretch) factor applied by the resolution-preserving technique."
    constraints: "Only read when doResolutionPreserving=true, in which case it is mandatory (no default); otherwise unused (1.0)."
  - name: "tRP0"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "t0"
    important: false
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Time at which the resolution-preserving rescaling starts, in program units."
    constraints: "Only read when doResolutionPreserving=true; defaults to the simulation start time t0."
  - name: "tRPMax"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "(computed)"
    important: false
    scope: "framework"
    category: "run"
    units: "program units"
    description: "Time at which the resolution-preserving rescaling stops, in program units."
    constraints: "Only read when doResolutionPreserving=true; defaults to an internally computed value (gettRPMaxtening())."

  # === framework / IC ===
  - name: "kCutOff"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "-1"
    important: true
    scope: "framework"
    category: "IC"
    units: "program units"
    description: "Momentum cutoff imposed in the spectrum of initial scalar fluctuations: modes above this momentum are set to zero. A value of -1 (default) means no cutoff (internally set to 2*kUV); 0 means initially vanishing fluctuations."
    constraints: "Default -1 is internally replaced by 2*kUV (i.e. no effective cutoff). kCutOff=0 gives vanishing initial fluctuations."
  - name: "ICtype_S"
    type: "enum"
    enum_values: ["Default", "RandomWithMatter", "DefectsNetwork", "DefectsWhiteNoise", "Homogeneous"]
    arity: "1"
    required: false
    default: "Default"
    important: false
    scope: "framework"
    category: "IC"
    units: "n/a"
    description: "Type of initial conditions used for scalar singlet fields (e.g. default vacuum fluctuations, random-with-matter, defect networks, white-noise defects, or homogeneous)."
    constraints: "Valid values: Default, RandomWithMatter, DefectsNetwork, DefectsWhiteNoise, Homogeneous (also accepts integers 0-4)."
  - name: "ICtype_U1"
    type: "enum"
    enum_values: ["Default", "RandomWithMatter", "PlaneWaves", "PlaneWavesZeroB", "BunchDavisTransverseU1", "DefectsNetwork", "DefectsWhiteNoise"]
    arity: "1"
    required: false
    default: "Default"
    important: false
    scope: "framework"
    category: "IC"
    units: "n/a"
    description: "Type of initial conditions used for U(1) gauge fields (e.g. default, random-with-matter, plane waves, plane waves with zero magnetic field, Bunch-Davies transverse modes, or defect networks)."
    constraints: "Valid values: Default, RandomWithMatter, PlaneWaves, PlaneWavesZeroB, BunchDavisTransverseU1, DefectsNetwork, DefectsWhiteNoise (also accepts integers 0-6)."
  - name: "baseSeed"
    type: "string"
    enum_values: null
    arity: "1"
    required: true
    default: null
    important: false
    scope: "framework"
    category: "IC"
    units: "n/a"
    description: "Seed for the random generator of initial field fluctuations; if not specified, a seed is generated randomly each run."
    constraints: "Read via getSeed; if absent a random seed is produced rather than throwing."

  - name: "lcorr"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: null
    important: false
    scope: "framework"
    category: "IC"
    units: "program units"
    description: "Initial comoving correlation length of the defect network used when generating DefectsNetwork initial conditions."
    constraints: "Only read when ICtype_S or ICtype_U1 is DefectsNetwork, in which case it is mandatory (no default); otherwise unused (0.0)."
  - name: "deltaNoise"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: null
    important: false
    scope: "framework"
    category: "IC"
    units: "dimensionless"
    description: "Amplitude of the white-noise field distribution used when generating DefectsWhiteNoise initial conditions."
    constraints: "Only read when ICtype_S or ICtype_U1 is DefectsWhiteNoise, in which case it is mandatory (no default); otherwise unused (0.0)."

  # === framework / output ===
  - name: "tOutputFreq"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "10*dt"
    important: true
    scope: "framework"
    category: "output"
    units: "program units"
    description: "Time interval between the printing of frequent output (e.g. averages) in program units."
    constraints: "Must be >= dt."
  - name: "tOutputInfreq"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "100*dt"
    important: true
    scope: "framework"
    category: "output"
    units: "program units"
    description: "Time interval between the printing of infrequent output (e.g. spectra) in program units."
    constraints: "Must be >= dt."
  - name: "tOutputRareFreq"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "1000*dt"
    important: true
    scope: "framework"
    category: "output"
    units: "program units"
    description: "Time interval between the printing of very infrequent (rare) output in program units."
    constraints: "Must be >= dt."
  - name: "tOutputVerb"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "100*dt"
    important: false
    scope: "framework"
    category: "output"
    units: "program units"
    description: "Time interval between progress updates printed to the terminal in program units."
    constraints: "Must be >= dt."
  - name: "outputfile"
    type: "string"
    enum_values: null
    arity: "1"
    required: false
    default: "./"
    important: false
    scope: "framework"
    category: "output"
    units: "path"
    description: "Folder where simulation output is saved; defaults to the current/compilation folder."
    constraints: null
  - name: "hdf5Averages"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true, averaged output quantities are written in HDF5 format instead of text format."
    constraints: null
  - name: "hdf5FlushFreq"
    type: "int"
    enum_values: null
    arity: "1"
    required: false
    default: "10"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "Number of writes between flushes of buffered HDF5 output to disk."
    constraints: null
  - name: "hdf5Spectra"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true, field spectra are printed in HDF5 format; if false, they are printed in text format."
    constraints: null
  - name: "appendToFiles"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true, output is appended to pre-existing files; if false, existing files cause an error unless overwriteFiles=true."
    constraints: "Cannot both be true with overwriteFiles (mutually exclusive; throws)."
  - name: "overwriteFiles"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true (and appendToFiles=false), existing output files are deleted before writing."
    constraints: "Cannot both be true with appendToFiles (mutually exclusive; throws)."
  - name: "print_headers"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true, a header line describing the contents is printed at the top of each text output file."
    constraints: null
  - name: "fn_verbosity"
    type: "int"
    enum_values: null
    arity: "1"
    required: false
    default: "0"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "Verbosity level controlling how much model/parameter information is embedded in output filenames (0 = none; higher levels append N, kIR, dt, evolver, etc.)."
    constraints: null

  - name: "tOutputFreqDiff"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "10*dtdiff"
    important: false
    scope: "framework"
    category: "output"
    units: "program units"
    description: "Time interval between frequent output during the diffusion phase, in program units (the diffusion-phase counterpart of tOutputFreq)."
    constraints: "Only read when doDiffusion=true; defaults to 10*dtdiff."
  - name: "tOutputRareFreqDiff"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "100*dtdiff"
    important: false
    scope: "framework"
    category: "output"
    units: "program units"
    description: "Time interval between rare/infrequent output during the diffusion phase, in program units (the diffusion-phase counterpart of tOutputRareFreq)."
    constraints: "Only read when doDiffusion=true; defaults to 100*dtdiff."
  - name: "measureDefectsEnergies"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true, enables measurement and output of the energy stored in the defect network."
    constraints: null
  - name: "measureDefectsStructure"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "output"
    units: "dimensionless"
    description: "If true, enables measurement and output of the defect-network structure/geometry (e.g. defect positions and length/area)."
    constraints: null

  # === framework / spectra ===
  - name: "spectraVerbosity"
    type: "int"
    enum_values: null
    arity: "1"
    required: false
    default: "0"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "Verbosity level controlling how much additional information is written into the spectra files."
    constraints: "Must be in range 0 to 2 (throws otherwise)."
  - name: "deltaKBin"
    type: "float"
    enum_values: null
    arity: "1"
    required: false
    default: "1"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "Width of the momentum bins used in the field spectra; the number of bins is approximately sqrt(3)*N/(2*deltaKBin)."
    constraints: null
  - name: "PS_type"
    type: "int"
    enum_values: null
    arity: "1"
    required: false
    default: "1"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "Power spectrum type selector controlling the binning/estimator used for the power spectra."
    constraints: "Must be 0 or 1; type 0 is only implemented for the unbinned power spectrum (requires saveUnbinnedSpectra=true)."
  - name: "PS_version"
    type: "int"
    enum_values: null
    arity: "1"
    required: false
    default: "1"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "Power spectrum version selector choosing among different power spectrum implementations."
    constraints: "Must be in range 1 to 3 (throws otherwise)."
  - name: "flagON"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "If true, enables the O(N) power spectrum computation/output for O(N) scalar field models."
    constraints: null
  - name: "flagChiralPS"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "If true, enables computation/output of chiral (helicity-decomposed) power spectra."
    constraints: null
  - name: "saveUnbinnedSpectra"
    type: "bool"
    enum_values: null
    arity: "1"
    required: false
    default: "false"
    important: false
    scope: "framework"
    category: "spectra"
    units: "dimensionless"
    description: "If true, the unbinned (per-mode) power spectra are saved in addition to the binned spectra."
    constraints: "Required to be true to use PS_type=0."

  # === framework / snapshots ===
  - name: "snapshots"
    type: "string"
    enum_values: null
    arity: "14"
    required: false
    default: "(empty list — no snapshots saved)"
    important: false
    scope: "framework"
    category: "snapshots"
    units: "n/a"
    description: "Space-separated list of the configuration-space quantities to dump as HDF5 field snapshots. Each entry must be one of the 14 recognised labels; you list any subset (in any order), one label per quantity you want saved. Recognised labels: S (scalar-singlet field value), E_S_K / E_S_G (scalar-singlet kinetic / gradient energy), CS (complex-scalar modulus), E_CS_K / E_CS_G (complex-scalar kinetic / gradient energy), E_SU2D_K / E_SU2D_G (SU(2)-doublet kinetic / gradient energy), E_A_K / E_A_G (U(1) electric / magnetic energy), E_B_K / E_B_G (SU(2) electric / magnetic energy), E_V (potential energy), E (total energy). Selecting a label for a sector the model does not contain is harmless and simply produces no file."
    constraints: "Variable-length subset, NOT 14 required values: the 14 is only the maximum (the number of distinct recognised labels). List as many or as few labels as you want; the parser checks membership of each recognised label in your list (order irrelevant, duplicates ignored) and caps the list at 14. Omitting the parameter, or giving an empty list, saves no snapshots (the C++ default fills the internal vector with Constants::defaultString, i.e. none selected)."
  - name: "energy_snapshot"
    type: "string"
    enum_values: null
    arity: "14"
    required: false
    default: null
    important: false
    scope: "framework"
    category: "snapshots"
    units: "n/a"
    description: "Deprecated alias for `snapshots`, kept for backward compatibility. If `snapshots` is not given but `energy_snapshot` is, its value fills `snapshots` and a deprecation notice is printed. If both are given, `snapshots` takes precedence and a conflict warning is printed."
    constraints: "Deprecated; use `snapshots` instead. Same label set and arity as `snapshots`."
  - name: "snap_lowercoord"
    type: "int"
    enum_values: null
    arity: "NDim"
    required: false
    default: "{0,...} (one 0 per dimension)"
    important: false
    scope: "framework"
    category: "snapshots"
    units: "dimensionless"
